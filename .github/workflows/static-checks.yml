name: Static checks (no Solaris runtime)
on:
  push:
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash script parsing
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check Python patcher syntax and test rewriting
        run: |
          python3 -m compileall -q patches
          python3 tests/test_patchers.py
